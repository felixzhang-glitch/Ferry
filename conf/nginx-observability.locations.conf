# Include inside the intended server {} block. Existing location / stays intact.
# Browser access uses the site's existing HTTPS termination; set
# OBSERVABILITY_COOKIE_SECURE=true. The backend itself stays on HTTP port 38080.
location = /observability/ {
    rewrite ^ /observability last;
}

# Device batches alone may exceed 4KB; ASGI enforces exact method/path limits.
# No access/error body logging and no temporary request/response disk copies.
location ^~ /api/observability/v1/device-data/ {
    proxy_pass http://127.0.0.1:38080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    add_header Cache-Control "no-store" always;
}

location ^~ /internal/device-data/ {
    return 404;
}

location ^~ /api/observability/v1/chat/ {
    proxy_pass http://127.0.0.1:38080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    client_max_body_size 11m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 700s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
}

location ~ ^/(observability/?|observability/(manifest\.webmanifest|sw\.js)|api/observability/v1(/.*)?|static/(dashboard\.(css|js)|console\.js|chat\.js|appearance\.js|notifications\.js|console-icon-(180|192|512|maskable)\.png)|metrics)$ {
    proxy_pass http://127.0.0.1:38080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering off;
    proxy_cache off;
}

# Never publish the sidecar's write-only endpoint through the reverse proxy.
location ^~ /internal/observability/ {
    return 404;
}

# The main service's console API is loopback-only; never route it from outside.
location ^~ /internal/console/ {
    return 404;
}

location ^~ /internal/chat/ {
    return 404;
}
