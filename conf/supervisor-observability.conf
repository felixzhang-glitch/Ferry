; Deployment template: replace /data/app/Ferry and HOME/USER for your installation.
; No credentials belong in this file; use the ignored .env.observability file.
; Install independently of ferry-stack; never add this program to that group.
[program:ferry-observability]
command=/data/app/Ferry/bin/run-observability
directory=/data/app/Ferry
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/app/Ferry/logs/observability.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/root",USER="root"
